<body>
  <main id="main-holder">
    <h1 id="login-header">Login to Beterword</h1>
    
    <div id="login-error-msg-holder">
      <p id="login-error-msg">Invalid username, please create an account.</p>
      <p id="wrong-password-error">Invalid password.</p>
    </div>

    
    <form id="login-form">
      <input type="text" name="username" id="username-field" class="login-form-field" placeholder="email">
      <input type="password" name="password" id="password-field" class="login-form-field" placeholder="Password">
      <input type="submit" value="Login" id="login-form-submit">
    </form>
    <div>
      <input type="button" id = "createButton" value = "Create Account" onclick = "goToCreate();">
    </div>
