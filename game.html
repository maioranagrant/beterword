<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</head>
<body>
    <div>
        <div style="padding-left: 50px; padding-top: 50px">
            <input type="button" id="startButton" value="Start" onclick="playTossup();">

            <input type="button" id="buzzButton" value="Buzz" onclick="buzz();" disabled>

            <input type="button" id="nextButton" value="Next Tossup" onclick="nextTossup();" style="visibility: hidden;" disabled>
        </div>
        <div style="padding-left: 50px; padding-top: 10px;">
            <div id="enterAnswer"  style="visibility: hidden;">
                <label for="answer">Answer:</label><br>
                <input type="text" id="answer">
                <input type="button" id="enterButton" value="Submit" onclick="evaluateAnswer();">
            </div>
        </div>
        <div id="display"  style="visibility: hidden; vertical-align: middle;"> 
            <p id="correctDisplay" style="padding-left: 50px; padding-top: 10px;">
                Placeholder
            </p>
            <p id="celerityDisplay" style="padding-left: 50px; padding-top: 10px;">
                0.0
            </p>
            <p id="scoreDisplay" style="padding-left: 50px; padding-top: 10px;">
                10
            </p>
        </div>
    </div>
</body>
<script src="main.js" defer></script>

</html>
